# EcoGain 统一入口（单域名 HTTP）：静态前端 + backend / auth-server 分流
# 路由拓扑（同源部署，无跨域）：
#   /                → SPA 静态文件（try_files 回退 index.html）
#   /assets/*        → 带 hash 静态资源，长缓存
#   /api/*           → backend:8000（REST + WebSocket，同一 location 走 Upgrade）
#   /auth/*          → backend:8000（OAuth 登录/回调/登出 302 链路）
#   /healthz         → backend:8000（腾讯云健康检查/运维探测）
#   /authorize       → auth-server:8001（浏览器登录页 GET/POST）
#   （/token /userinfo 为服务间接口，backend 走 AUTH_INTERNAL_BASE_URL 容器内网直连，不经 nginx）

# WebSocket 升级：无 Upgrade 头的普通请求 Connection 按 close 处理，同一 location 通吃 REST 与 WS
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 附件上传上限（csv/xlsx/txt/md，预留余量）
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 认证中心：浏览器登录页 ----
    location = /authorize {
        proxy_pass http://auth-server:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- backend：OAuth 302 链路 + 健康检查 ----
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8000;
    }

    # ---- backend：/api REST + WS（分析任务经 WS 长连接推送，前端 30s ping 保活，读超时放宽防误杀）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA：带 hash 产物长缓存，其余路由一律回退 index.html（前端路由/history 模式）----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
