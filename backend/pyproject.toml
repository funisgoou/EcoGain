[project]
name = "ecogain-backend"
version = "0.1.0"
description = "EcoGain 经营归因分析系统——后端主服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "asyncmy==0.2.14",
    "alembic==1.19.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "loguru==0.7.3",
    "httpx==0.28.1",
    "duckdb==1.5.5",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "aiofiles==25.1.0",
    "python-multipart==0.0.32",
    "langchain==1.3.15",
    "langgraph==1.2.11",
    "langchain-openai==1.5.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
